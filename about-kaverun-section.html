<section
  id="kv-au"
  class="kv-au"
  dir="rtl"
  itemscope
  itemtype="https://schema.org/Organization"
  aria-labelledby="kv-au-title"
>
  <meta itemprop="foundingDate" content="1385" />
  <meta itemprop="name" content="گروه صنعتی کاوران (Kaverun)" />

  <div class="kv-au__inner">
    <div class="kv-au__head" data-kv-reveal>
      <p class="kv-au__eyebrow">
        <span class="kv-au__eyebrow-dot" aria-hidden="true"></span>
        از سال ۱۳۸۵ در شهر صنعتی کاوه
      </p>
      <h2 id="kv-au-title" class="kv-au__title">
        درباره <span class="kv-au__brand">کاوران</span>
      </h2>
      <p class="kv-au__lede" itemprop="description">
        گروه صنعتی <strong>کاوران (Kaverun)</strong> تولیدکننده و فروشنده‌ی انواع
        <strong>بیل مکانیکی، لودر، لیفتراک</strong> و ماشین‌آلات
        <strong>راه‌سازی، ساختمانی و کشاورزی</strong> در شهر صنعتی کاوه است.
      </p>
    </div>

    <div class="kv-au__actions" data-kv-reveal>
      <a class="kv-au__btn kv-au__btn--primary" href="/about"
         aria-label="آشنایی بیشتر با گروه صنعتی کاوران در صفحه درباره ما">
        درباره ما
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M15 6l-6 6 6 6"/></svg>
      </a>
      <a class="kv-au__btn kv-au__btn--ghost" href="/contact"
         aria-label="تماس با کارشناسان فروش کاوران">
        تماس با ما
      </a>
    </div>
  </div>
</section>

<style id="kv-au-styles">
#kv-au, #kv-au *, #kv-au *::before, #kv-au *::after { box-sizing: border-box; }

#kv-au {
  --kv-bg: #0b0c10;
  --kv-fg: #ffffff;
  --kv-muted: rgba(255,255,255,.72);
  --kv-accent: #FFC72C;
  --kv-ink: #111111;
  --kv-line: rgba(255,255,255,.10);
  --kv-ease: cubic-bezier(.22,1,.36,1);

  position: relative; width: 100%; margin: 0;
  padding: clamp(56px, 9vw, 120px) clamp(18px, 5vw, 80px);
  background:
    radial-gradient(90% 70% at 50% -10%, rgba(255,199,44,.10) 0%, rgba(255,199,44,0) 50%),
    var(--kv-bg);
  color: var(--kv-fg); direction: rtl; font-family: inherit; overflow: hidden;
}
#kv-au::before {
  content: ""; position: absolute; inset: 0;
  background-image: linear-gradient(var(--kv-line) 1px, transparent 1px),
                    linear-gradient(90deg, var(--kv-line) 1px, transparent 1px);
  background-size: 46px 46px;
  -webkit-mask-image: radial-gradient(70% 60% at 50% 0%, #000 0%, transparent 78%);
          mask-image: radial-gradient(70% 60% at 50% 0%, #000 0%, transparent 78%);
  opacity: .4; pointer-events: none;
}

#kv-au .kv-au__inner {
  position: relative; z-index: 1;
  max-width: 780px; margin: 0 auto; text-align: center;
}
#kv-au .kv-au__eyebrow {
  display: inline-flex; align-items: center; gap: 9px; margin: 0 0 20px;
  padding: 8px 16px; border: 1px solid var(--kv-line); border-radius: 999px;
  background: rgba(255,255,255,.03);
  font-size: clamp(12px, 1.2vw, 14px); font-weight: 700; color: var(--kv-accent);
}
#kv-au .kv-au__eyebrow-dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--kv-accent);
  animation: kvAuPulse 2.2s ease-out infinite;
}
@keyframes kvAuPulse {
  0% { box-shadow: 0 0 0 0 rgba(255,199,44,.55); }
  70% { box-shadow: 0 0 0 10px rgba(255,199,44,0); }
  100% { box-shadow: 0 0 0 0 rgba(255,199,44,0); }
}
#kv-au .kv-au__title {
  margin: 0 0 18px; font-size: clamp(30px, 5vw, 52px);
  line-height: 1.2; font-weight: 800; letter-spacing: -.01em;
}
#kv-au .kv-au__brand { color: var(--kv-accent); }
#kv-au .kv-au__lede {
  margin: 0 auto; max-width: 620px;
  font-size: clamp(15px, 1.8vw, 19px); line-height: 2; color: var(--kv-muted);
}
#kv-au .kv-au__lede strong { color: #fff; font-weight: 700; }

#kv-au .kv-au__actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 34px; }
#kv-au .kv-au__btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 14px 30px; border-radius: 999px;
  font-weight: 700; font-size: 15px; text-decoration: none;
  border: 2px solid transparent; cursor: pointer;
  transition: transform .18s var(--kv-ease), box-shadow .2s var(--kv-ease), background-color .2s, border-color .2s;
}
#kv-au .kv-au__btn svg { transition: transform .2s var(--kv-ease); }
#kv-au .kv-au__btn--primary { background: var(--kv-accent); color: var(--kv-ink); box-shadow: 0 12px 30px rgba(255,199,44,.30); }
#kv-au .kv-au__btn--primary:hover { transform: translateY(-2px); box-shadow: 0 16px 38px rgba(255,199,44,.45); }
#kv-au .kv-au__btn--primary:hover svg { transform: translateX(-4px); }
#kv-au .kv-au__btn--ghost { background: rgba(255,255,255,.05); color: #fff; border-color: var(--kv-line); }
#kv-au .kv-au__btn--ghost:hover { border-color: rgba(255,255,255,.5); background: rgba(255,255,255,.1); }
#kv-au .kv-au__btn:focus-visible { outline: 3px solid var(--kv-accent); outline-offset: 3px; }

#kv-au [data-kv-reveal] { opacity: 0; transform: translateY(24px); transition: opacity .7s var(--kv-ease), transform .7s var(--kv-ease); }
#kv-au.is-in [data-kv-reveal] { opacity: 1; transform: none; }
#kv-au.is-in .kv-au__actions[data-kv-reveal] { transition-delay: .15s; }

@media (max-width: 480px) {
  #kv-au .kv-au__actions .kv-au__btn { flex: 1 1 auto; justify-content: center; }
}
@media (prefers-reduced-motion: reduce) {
  #kv-au * { animation: none !important; }
  #kv-au [data-kv-reveal] { opacity: 1 !important; transform: none !important; }
}
</style>

<script id="kv-au-script">
(function () {
  'use strict';
  var root = document.getElementById('kv-au');
  if (!root || root.dataset.kvInit === '1') return;
  root.dataset.kvInit = '1';
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { if (e.isIntersecting) { root.classList.add('is-in'); io.disconnect(); } });
    }, { threshold: 0.2 });
    io.observe(root);
  } else { root.classList.add('is-in'); }
})();
</script>
<!-- ============ END KAVERUN — درباره کاوران ============ -->
